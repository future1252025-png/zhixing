name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number
      version_name:
        description: User-facing version name (for example 1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
      VITE_AMAP_KEY: ${{ secrets.ANDROID_AMAP_KEY }}
      VITE_AMAP_SECURITY_CODE: ''
      VITE_AMAP_SERVICE_HOST: ${{ vars.ANDROID_AMAP_SERVICE_HOST }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Restore the release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campusmind-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/campusmind-release.jks" >> "$GITHUB_ENV"
      - name: Validate and sync production Android assets
        run: npm run android:sync
      - name: Test, lint and build signed release AAB
        run: ./gradlew clean test lintRelease bundleRelease --no-daemon
        working-directory: frontend/android
      - name: Verify AAB signature
        shell: bash
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed Play Store bundle
        uses: actions/upload-artifact@v6
        with:
          name: campusmind-${{ inputs.version_name }}-${{ inputs.version_code }}-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
