name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.lock
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r ../backend/requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Generate non-publishable CI release configuration
        shell: bash
        run: |
          echo "VITE_API_BASE_URL=https://api.github.com" >> "$GITHUB_ENV"
          echo "VITE_AMAP_KEY=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "VITE_AMAP_SECURITY_CODE=" >> "$GITHUB_ENV"
          echo "VITE_AMAP_SERVICE_HOST=https://github.com/_AMapService" >> "$GITHUB_ENV"
      - name: Validate and sync production Android assets
        run: npm run android:sync
      - name: Run Android tests, release lint, APK and AAB compilation
        run: ./gradlew test lintRelease assembleRelease bundleRelease --no-daemon
        working-directory: frontend/android
